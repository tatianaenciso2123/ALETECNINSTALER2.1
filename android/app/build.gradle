plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aletecninstaler.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.aletecninstaler.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def keystoreFile = file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
                keyAlias System.getenv("KEY_ALIAS") ?: "androiddebugkey"
                keyPassword System.getenv("KEY_PASSWORD") ?: "android"
            } else {
                // Fallback a keystore estándar para generación autónoma de APKs firmados
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def formattedName = "ALE_TECNINSTALER_${variant.name}.apk"
            outputFileName = formattedName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// =========================================================================
// Tarea Gradle para copiar el APK generado al directorio de artefactos estáticos
// =========================================================================
tasks.register('copyReleaseApkToArtifacts') {
    group = 'build'
    description = 'Copia el archivo APK generado por assembleRelease al directorio de artefactos estáticos accesible.'
    doLast {
        def staticDirs = [
            file("${project.rootDir}/../dist/artifacts"),
            file("${project.rootDir}/../public/artifacts"),
            file("${project.rootDir}/artifacts")
        ]

        staticDirs.each { dir ->
            if (!dir.exists()) {
                dir.mkdirs()
            }
        }

        def releaseOutputsDir = file("${buildDir}/outputs/apk/release")
        if (releaseOutputsDir.exists()) {
            staticDirs.each { targetDir ->
                copy {
                    from releaseOutputsDir
                    into targetDir
                    include "*.apk"
                }
            }
            println "[ALE TECNINSTALER] ✅ APK de Release copiado exitosamente al directorio de artefactos estáticos."
        }
    }
}

// Vincular automáticamente la tarea al finalizar assembleRelease
tasks.matching { it.name == "assembleRelease" }.configureEach {
    finalizedBy('copyReleaseApkToArtifacts')
}

